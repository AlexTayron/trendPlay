# ==============================================================================
# Nginx — Proxy Reverso para TrendPlay / DevCore em Subdomínio Único
# ==============================================================================
# 1. Substitua `cursos.seudominio.com` pelo seu subdomínio real.
# 2. Copie para: /etc/nginx/sites-available/trendplay.conf
# 3. Ative o site: sudo ln -s /etc/nginx/sites-available/trendplay.conf /etc/nginx/sites-enabled/
# 4. Teste e recarregue: sudo nginx -t && sudo systemctl reload nginx
# 5. Ative HTTPS automático: sudo certbot --nginx -d cursos.seudominio.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cursos.seudominio.com;

    # Streaming de vídeos/PDFs do Google Drive (SEM buffering para Range Requests instantâneos)
    location /api/drive/files/ {
        proxy_pass http://127.0.0.1:4100/drive/files/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # API NestJS (/api/* -> 127.0.0.1:4100/*)
    location /api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }

    # Frontend Next.js (/* -> 127.0.0.1:3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
