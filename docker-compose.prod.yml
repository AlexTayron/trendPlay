# ==============================================================================
# DevCore / TrendPlay — Docker Compose de Produção para VPS (Hostinger + Nginx)
# ==============================================================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# As portas são publicadas APENAS em 127.0.0.1 para o Nginx local da VPS.
# O PostgreSQL fica 100% interno (sem conflitar com outros bancos da VPS).
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trendplay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devcore}
      POSTGRES_USER: ${POSTGRES_USER:-devcore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD no .env.prod}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no .env.prod}
    volumes:
      - trendplay_pgdata:/var/lib/postgresql/data
      - ./packages/database/migrations/0000_baseline_patch.sql:/docker-entrypoint-initdb.d/00_baseline_patch.sql:ro
      - ./deploy/init-db/01_set_app_password.sh:/docker-entrypoint-initdb.d/01_set_app_password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcore_admin} -d ${POSTGRES_DB:-devcore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trendplay_net

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: trendplay-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN no .env.prod}
      DATABASE_APP_URL: postgresql://devcore_app:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-devcore}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Defina GOOGLE_CLIENT_ID no .env.prod}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Defina GOOGLE_CLIENT_SECRET no .env.prod}
      GOOGLE_CALLBACK_URL: https://${APP_DOMAIN}/api/auth/google/callback
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:?Defina GOOGLE_PICKER_API_KEY no .env.prod}
      GOOGLE_APP_ID: ${GOOGLE_APP_ID:-}
      GOOGLE_DRIVE_SCOPE: ${GOOGLE_DRIVE_SCOPE:-https://www.googleapis.com/auth/drive.file}
      MAX_REGISTERED_USERS: ${MAX_REGISTERED_USERS:-90}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Defina ENCRYPTION_MASTER_KEY no .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env.prod}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4100}:4000"
    networks:
      - trendplay_net

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: trendplay-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:3000"
    networks:
      - trendplay_net

volumes:
  trendplay_pgdata:
    driver: local

networks:
  trendplay_net:
    driver: bridge
